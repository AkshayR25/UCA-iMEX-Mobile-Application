allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url ("https://jitpack.io/") }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
                buildToolsVersion "35.0.0"
                if (namespace == null) {
                        namespace project.group
                    }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.activity' && !details.requested.name.contains('compose')) {
                details.useVersion "1.9.3"
            }
            if (details.requested.group == 'androidx.core' && !details.requested.name.contains('compose')) {
                details.useVersion "1.13.1"
            }
            if (details.requested.group == 'androidx.browser' && !details.requested.name.contains('compose')) {
                details.useVersion "1.8.0"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
